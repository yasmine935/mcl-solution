name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests-et-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Tests (vitest)
        run: npx ng test
        env:
          CI: 'true'

      - name: Build de production
        run: npx ng build
